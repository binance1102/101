name: Plan1 temporary exact transfer
on:
  push:
    branches: [main]

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download exact bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p transfer
          base="https://multibook.app/BeVQDEe0qmpelUpfo9GYcpAMaxFwD9Qw"
          for i in $(seq -w 1 10); do
            curl --fail --location --retry 4 --retry-delay 2 "$base/exact_transfer_${i}.zip" -o "transfer/exact_transfer_${i}.zip"
          done
          cat > /tmp/sha256s <<'EOF'
1211e3e6b5f1bac225f219a5ef7b643bfaa904dedcefc5685d48513e36c405e3  transfer/exact_transfer_01.zip
e96c354394c0968d8c955ce9f12300a924f6c4e9ac54fe252883745a91c1c7fb  transfer/exact_transfer_02.zip
ad994248ba3c42b3ea42d390c137148b2b14bd9114e5f0c51a9ac99df02f26fc  transfer/exact_transfer_03.zip
6d915ddb8efe0f625da0fe5285c543523a6ac0736dc3405e7860d612b8cd6adb  transfer/exact_transfer_04.zip
175d3f06e370d6459a376cdf40c0e5ac3a9409d94fbb01585d96188aaefc9728  transfer/exact_transfer_05.zip
49d4348e5f0040cdfebce85ea8f2d6d9ad807d586113734d9222ac5f3db4040c  transfer/exact_transfer_06.zip
a8e7d284acb97cb1cc0fd016bae729f5091775b2995d00a92f2dc3b2cf62c407  transfer/exact_transfer_07.zip
759a24d624a8a632aebaedd9b5d79ff19853c4aa79c2c42aefe01fca6719a07f  transfer/exact_transfer_08.zip
3c45a944c2b91340fb6e714c1361b726a6396b0d5b89a340f618f21d776d7af8  transfer/exact_transfer_09.zip
5845f03df87ce4b2a5895df78946a1eba2b7f72a75c82a204401bc0634b8d55e  transfer/exact_transfer_10.zip
EOF
          sha256sum -c /tmp/sha256s
      - name: Upload verified transfer artifact
        uses: actions/upload-artifact@v4
        with:
          name: plan1-exact-transfer-20261003
          path: transfer/*.zip
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
